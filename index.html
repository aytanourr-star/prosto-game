<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#a40822"><title>PROSTO GAME | Catch the Prosto!</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78051b;font-family:Arial,system-ui,sans-serif;touch-action:none}button{font:inherit;cursor:pointer;touch-action:manipulation}#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#e51a36,#66021a)}#frame{height:100%;width:min(100%,560px);position:relative;overflow:hidden;background:#9a0922;box-shadow:0 0 90px #26000b}canvas{width:100%;height:100%;display:block;touch-action:none}#screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:22px 18px calc(35px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#530013ee 0%,#8a0623aa 26%,transparent 67%);color:white;text-align:center}#screen.menu{background-image:linear-gradient(0deg,#500014f5 0%,#790018c9 25%,transparent 62%),url('assets/poster.jpg?v=20260919fix3');background-position:center,center;background-size:cover,cover}#screen.end{background:linear-gradient(160deg,#bb0727,#670019)}#screen.how{background:linear-gradient(145deg,#aa1028,#53001a)}.hidden{display:none!important}.logo{font-size:clamp(42px,10vw,64px);line-height:.88;font-weight:1000;color:#ffdf57;letter-spacing:-3px;-webkit-text-stroke:2px #9b2909;text-shadow:0 4px #fff,0 9px #661022,0 14px 15px #25000d;filter:drop-shadow(0 3px 2px #38000b)}.pepper{font-size:.65em;display:inline-block;transform:rotate(-15deg);margin:0 -5px}.subtitle{font-weight:1000;font-size:20px;color:#fff6b8;text-shadow:0 3px #700015;margin:14px 0}.btn{display:block;width:min(100%,380px);border:3px solid #fff3ae;border-radius:19px;background:linear-gradient(#fff18c,#ffb716);color:#76122a;font-weight:1000;font-size:23px;padding:13px 8px;margin:8px auto;box-shadow:0 6px #973507,0 12px 22px #35000c80}.btn:active{transform:translateY(4px);box-shadow:0 2px #973507}.btn.red{background:linear-gradient(#f34b60,#b8092c);color:#fff;box-shadow:0 6px #5c071d}.card{width:min(100%,400px);padding:15px;border:3px solid #ffdc62;border-radius:24px;background:#79071de9;box-shadow:0 10px 30px #26000b80;margin:15px auto;color:white;font-weight:700;line-height:1.65}.card p{margin:7px 0}.mascot{width:min(52vw,190px);height:150px;object-fit:contain;filter:drop-shadow(0 8px 6px #30000a)}#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:none;align-items:center;justify-content:space-between;gap:2px;border:2px solid #ffda62;border-radius:14px;background:#9a0928ed;color:white;padding:7px 4px;font-size:10px;font-weight:900;text-align:center;box-shadow:0 5px 14px #50000a8c}#hud b{display:block;color:#ffe45d;font-size:clamp(13px,3.8vw,21px);margin-top:3px}#hud button{border:2px solid #fff0a3;border-radius:50%;background:linear-gradient(#ffe76b,#ffaf10);width:32px;height:32px;font-size:17px}#toast{position:absolute;top:26%;left:50%;transform:translateX(-50%);font-size:30px;color:#fff46d;font-weight:1000;text-shadow:0 4px #980d2a,0 7px 10px #270009;white-space:nowrap;opacity:0;pointer-events:none}#toast.pop{animation:pop 1s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,25px) scale(.5)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.18)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-35px)}}#controls{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;display:none;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;border:3px solid #fff3ad;background:linear-gradient(#ffe978,#ffae00);color:#ad0a29;font-size:30px;font-weight:900;border-radius:50%;width:66px;height:60px;box-shadow:0 5px #9c3b06}#screen .foot{font-weight:bold;font-style:italic;text-shadow:0 2px #52000d;margin:13px 0 0}#result{font-size:50px;color:#ffe05a;font-weight:1000;text-shadow:0 5px #7e1221}
</style></head><body><main id="stage"><div id="frame"><canvas id="canvas"></canvas><div id="hud"><div>SCORE<b id="score">0</b></div><div>TIME<b id="time">60</b></div><div>LEVEL<b id="level">1/5</b></div><div>SPEED<b id="speed">100</b></div><div>LIVES<b id="lives">❤️❤️❤️</b></div><button id="sound" aria-label="Sound">🔊</button><button id="pause" aria-label="Pause">⏸</button></div><div id="toast"></div><div id="controls"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div><div id="screen" class="menu"><div class="logo">PROST<span class="pepper">🌶️</span>O<br><span style="font-size:.65em;color:white">GAME</span></div><div class="subtitle">🍗 CATCH THE PROSTO! 🍟</div><button class="btn" id="play">▶ PLAY NOW</button><button class="btn red" id="how">HOW TO PLAY</button><div class="foot">Good Food, Good Mood! ❤️</div></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),frame=$('frame'),c=$('canvas'),ctx=c.getContext('2d'),screen=$('screen'),hud=$('hud'),controls=$('controls'),toastEl=$('toast');let W=400,H=750,dpr=1,mode='menu',score=0,lives=3,time=60,items=[],parts=[],texts=[],spawn=.2,last=0,inv=0,shake=0,flash=0,bucket={x:200,y:640,w:105,h:78,visible:true},target=200,held=0,paused=false,muted=false,audio=null,best=0;try{best=Number(localStorage.getItem('prosto3d_best')||0)}catch(e){}const names=['drumstick','fries','drink','meal','gold','burnt','bomb','bucket','star','coin','poster','scene'];const images={};for(const n of names){const im=new Image();im.src='assets/'+n+(n==='poster'||n==='scene'?'.jpg':'.png')+'?v=20260919fix3';images[n]=im}const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=frame.clientWidth;H=frame.clientHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);bucket.w=clamp(W*.30,90,135);bucket.h=bucket.w*.46;bucket.y=H-Math.max(130,H*.17);bucket.x=clamp(bucket.x||W/2,bucket.w/2,W-bucket.w/2);target=bucket.x}addEventListener('resize',resize);resize();function sound(type){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let t=audio.currentTime;const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.type=type==='boom'?'sawtooth':'sine';let f=type==='boom'?130:type==='up'?430:650;osc.frequency.setValueAtTime(f,t);osc.frequency.exponentialRampToValueAtTime(type==='boom'?38:type==='up'?1100:950,t+.2);gain.gain.setValueAtTime(type==='boom'?.25:.075,t);gain.gain.exponentialRampToValueAtTime(.001,t+(type==='boom'?.55:.22));osc.start(t);osc.stop(t+(type==='boom'?.56:.23))}catch(e){}}function toast(s){toastEl.textContent=s;toastEl.classList.remove('pop');void toastEl.offsetWidth;toastEl.classList.add('pop')}function level(){return Math.min(5,Math.floor(score/200)+1)}function speed(){return [100,400,700,1000,1300][level()-1]}function updateHud(){$('score').textContent=score;$('time').textContent=Math.ceil(time);$('level').textContent=level()+'/5';$('speed').textContent=speed();$('lives').textContent='❤️'.repeat(lives)}function show(html,cls){mode=cls;screen.className=cls;screen.innerHTML=html;hud.style.display='none';controls.style.display='none';screen.classList.remove('hidden')}function menu(){show('<div class="logo">PROST<span class="pepper">🌶️</span>O<br><span style="font-size:.65em;color:white">GAME</span></div><div class="subtitle">🍗 CATCH THE PROSTO! 🍟</div><button class="btn" id="play">▶ PLAY NOW</button><button class="btn red" id="how">HOW TO PLAY</button><div class="foot">Good Food, Good Mood! ❤️</div>','menu');$('play').onclick=start;$('how').onclick=how}function how(){show('<div class="logo" style="font-size:40px">HOW TO PLAY</div><div class="card"><p>👆 Drag the PROSTO box or use ◀ ▶ to catch food.</p><p>🍗 +10 &nbsp; 🍟 +5 &nbsp; 🥤 +15<br>⭐ +25 &nbsp; ✨ Golden chicken +50</p><p>💣 Avoid bombs and burnt chicken! The box EXPLODES and you lose a life.</p><p>🔥 Every 200 points: SPEED UP!<br>100 → 400 → 700 → 1000 → 1300</p><p>❤️ 3 lives · ⏱️ 60 seconds</p></div><button class="btn" id="go">▶ PLAY NOW</button><button class="btn red" id="back">← BACK</button>','how');$('go').onclick=start;$('back').onclick=menu}function start(){score=0;lives=3;time=60;items=[];parts=[];texts=[];spawn=.25;inv=0;shake=0;flash=0;paused=false;bucket.visible=true;bucket.x=W/2;target=W/2;mode='play';screen.classList.add('hidden');hud.style.display='flex';controls.style.display='flex';$('pause').textContent='⏸';updateHud();sound('up')}function end(){mode='end';if(score>best){best=score;try{localStorage.setItem('prosto3d_best',best)}catch(e){}}show('<div class="logo">AMAZING!</div><div class="card"><div style="font-size:23px">YOU ARE A PROSTO MASTER!</div><div id="result">⭐ '+score+'</div><div>🏆 BEST: '+best+'</div></div><button class="btn" id="again">↻ PLAY AGAIN</button><button class="btn red" id="share">↗ SHARE YOUR SCORE</button><button class="btn red" id="home">⌂ MAIN MENU</button>','end');$('again').onclick=start;$('home').onclick=menu;$('share').onclick=async()=>{let text='I scored '+score+' points in PROSTO GAME! 🍗🎮';try{if(navigator.share)await navigator.share({title:'PROSTO GAME',text,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(text+' '+location.href);toast('SCORE COPIED!')}else alert(text)}catch(e){}};sound('up')}
$('play').onclick=start;$('how').onclick=how;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};$('pause').onclick=()=>{if(mode!=='play')return;paused=!paused;$('pause').textContent=paused?'▶':'⏸';toast(paused?'PAUSED':'GO!')};function pointer(e){if(mode!=='play'||paused)return;let r=c.getBoundingClientRect();target=clamp(e.clientX-r.left,bucket.w/2,W-bucket.w/2)}c.addEventListener('pointerdown',e=>{pointer(e);try{c.setPointerCapture(e.pointerId)}catch(x){}});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});function bindMove(id,dir){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();held=dir;try{b.setPointerCapture(e.pointerId)}catch(x){}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{held=0})}bindMove('left',-1);bindMove('right',1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')held=-1;if(e.key==='ArrowRight')held=1;if(e.key===' '&&mode==='play'){$('pause').click();e.preventDefault()}});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))held=0});function addItem(){let r=Math.random(),type=r<.30?'drumstick':r<.51?'fries':r<.68?'drink':r<.77?'star':r<.83?'gold':r<.92?'burnt':'bomb';let size=type==='meal'?65:type==='drumstick'||type==='gold'?66:type==='drink'?59:type==='fries'?57:52;size*=clamp(W/390,.75,1.12);items.push({type,x:rand(size/2,W-size/2),y:-size,sz:size,vy:speed()*rand(.90,1.15),rot:rand(-.22,.22),spin:rand(-.5,.5)})}function burst(x,y,bad){for(let i=0;i<(bad?46:13);i++){let a=rand(0,Math.PI*2),v=rand(bad?90:35,bad?390:170);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(bad?60:35),life:rand(.35,.9),max:.9,r:rand(3,bad?13:7),color:bad?['#ffdf27','#ff5a14','#ff1b1b','#48231a','#ffffff'][i%5]:['#ffe248','#fff','#ff8b10'][i%3]})}}function hit(it){if(it.type==='bomb'||it.type==='burnt'){if(inv>0)return;lives--;inv=1.5;shake=19;flash=.4;bucket.visible=false;burst(bucket.x,bucket.y,true);sound('boom');toast(lives?'💥 BOOM! -1 ❤️':'💥 GAME OVER!');updateHud();if(!lives){setTimeout(()=>{if(mode==='play')end()},900)}else setTimeout(()=>{if(mode==='play')bucket.visible=true},650);return}let pts={drumstick:10,fries:5,drink:15,star:25,gold:50,meal:30}[it.type]||10,old=level();score+=pts;burst(it.x,it.y,false);texts.push({x:it.x,y:it.y,life:.75,text:'+'+pts});sound('catch');if(level()>old){toast('🔥 SPEED UP! '+speed());sound('up')}updateHud()}function drawImage(n,x,y,w,h,angle=0){let im=images[n];if(!im||!im.complete||!im.naturalWidth)return;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}function bg(){let im=images.scene;if(im.complete&&im.naturalWidth){ctx.drawImage(im,0,0,W,H)}else{let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#159df3');g.addColorStop(.65,'#8bd8ff');g.addColorStop(1,'#bb3928');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}ctx.fillStyle='#8d0b23aa';ctx.fillRect(0,H-85,W,85);ctx.fillStyle='#ffda4e';ctx.fillRect(0,H-87,W,4)}function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));bg();for(let it of items)drawImage(it.type,it.x,it.y,it.sz,images[it.type]?.naturalWidth?it.sz*images[it.type].naturalHeight/images[it.type].naturalWidth:it.sz,it.rot);if(bucket.visible){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(bucket.x,bucket.y+bucket.h*.47,bucket.w*.45,9,0,0,Math.PI*2);ctx.fill();drawImage('bucket',bucket.x,bucket.y,bucket.w,bucket.h)}for(let p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.font='900 23px Arial';ctx.textAlign='center';ctx.lineWidth=4;for(let t of texts){ctx.strokeStyle='#8a0921';ctx.fillStyle='#ffdf39';ctx.strokeText(t.text,t.x,t.y);ctx.fillText(t.text,t.x,t.y)}if(flash>0){ctx.fillStyle='rgba(255,65,0,'+Math.min(.65,flash)+')';ctx.fillRect(0,0,W,H)}ctx.restore()}function tick(ts){let dt=Math.min(.035,(ts-last)/1000||0);last=ts;if(mode==='play'&&!paused){time=Math.max(0,time-dt);if(time===0)end();if(inv>0)inv-=dt;shake=Math.max(0,shake-dt*70);flash=Math.max(0,flash-dt*2);if(held)target=clamp(target+held*W*1.4*dt,bucket.w/2,W-bucket.w/2);bucket.x+=(target-bucket.x)*Math.min(1,dt*18);spawn-=dt;if(spawn<=0){addItem();spawn=clamp(.85-(level()-1)*.12,.30,.85)*rand(.8,1.2)}for(let i=items.length-1;i>=0;i--){let it=items[i];it.y+=it.vy*dt;it.rot+=it.spin*dt;if(bucket.visible&&Math.abs(it.x-bucket.x)<(bucket.w+it.sz)*.34&&Math.abs(it.y-(bucket.y-bucket.h*.15))<(bucket.h+it.sz)*.33){items.splice(i,1);hit(it)}else if(it.y>H+it.sz)items.splice(i,1)}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=440*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].y-=60*dt;texts[i].life-=dt;if(texts[i].life<=0)texts.splice(i,1)}updateHud()}if(mode==='play'||mode==='menu'||mode==='how'||mode==='end')draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);})();
</script></body></html>
