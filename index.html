(()=>{'use strict';const $=id=>document.getElementById(id),frame=$('frame'),c=$('canvas'),ctx=c.getContext('2d'),screen=$('screen'),hud=$('hud'),controls=$('controls'),toastEl=$('toast');let W=400,H=750,dpr=1,mode='menu',score=0,lives=3,time=180,items=[],parts=[],texts=[],spawn=.2,last=0,inv=0,shake=0,flash=0,bucket={x:200,y:640,w:105,h:78,visible:true},target=200,held=0,paused=false,muted=false,audio=null,best=0,session=0;try{best=Number(localStorage.getItem('prosto3d_best')||0)}catch(e){}const names=['drumstick','fries','drink','meal','gold','burnt','bomb','bucket','star','coin','poster','scene'];const images={};for(const n of names){const im=new Image();im.src='assets/'+n+(n==='poster'||n==='scene'?'.jpg':'.png')+'?v=20260920mobile2';images[n]=im}const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=frame.clientWidth;H=frame.clientHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);bucket.w=clamp(W*.30,90,135);bucket.h=bucket.w*.46;bucket.y=H-Math.max(130,H*.17);bucket.x=clamp(bucket.x||W/2,bucket.w/2,W-bucket.w/2);target=bucket.x}addEventListener('resize',resize);resize();function sound(type){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let t=audio.currentTime;const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.type=type==='boom'?'sawtooth':'sine';let f=type==='boom'?130:type==='up'?430:650;osc.frequency.setValueAtTime(f,t);osc.frequency.exponentialRampToValueAtTime(type==='boom'?38:type==='up'?1100:950,t+.2);gain.gain.setValueAtTime(type==='boom'?.25:.075,t);gain.gain.exponentialRampToValueAtTime(.001,t+(type==='boom'?.55:.22));osc.start(t);osc.stop(t+(type==='boom'?.56:.23))}catch(e){}}function toast(s){toastEl.textContent=s;toastEl.classList.remove('pop');void toastEl.offsetWidth;toastEl.clas  ARE A PROSTO MASTER!</div><div class="end-trophy">🏆</div><div class="end-score-label">YOUR SCORE</div><div id="result">'+score+'</div><div class="end-best">'+(newBest?'👑 NEW BEST!':'⭐ BEST: '+best)+'</div><div class="end-stats"><div>⏱️ TIME<b>03:00</b></div><div>🔥 LEVEL<b>'+level()+' / 5</b></div><div>🏆 BEST<b>'+best+'</b></div></div></div><div class="end-slogan">Good Food, Good Mood! ❤️</div><button class="btn" id="again">↻ PLAY AGAIN</button><button class="btn red" id="share">↗ SHARE YOUR SCORE</button><button class="btn red" id="home">⌂ MAIN MENU</button></div>','end');$('again').onclick=start;$('home').onclick=menu;$('share').onclick=async()=>{let text='I scored '+score+' points in PROSTO GAME! 🍗🎮';try{if(navigator.share)await navigator.share({title:'PROSTO GAME',text,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(text+' '+location.href);toast('SCORE COPIED!')}else alert(text)}catch(e){}};sound('up')}$('play').onclick=start;$('how').onclick=how;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};$('pause').onclick=()=>{if(mode!=='play')return;paused=!paused;$('pause').textContent=paused?'▶':'⏸';toast(paused?'PAUSED':'GO!')};function pointer(e){if(mode!=='play'||paused)return;let r=c.getBoundingClientRect();target=clamp(e.clientX-r.left,bucket.w/2,W-bucket.w/2)}c.addEventListener('pointerdown',e=>{pointer(e);try{c.setPointerCapture(e.pointerId)}catch(x){}});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});function bindMove(id,dir){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();held=dir;try{b.setPointerCapture(e.pointerId)}catch(x){}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{held=0})}bindMove('left',-1);bindMove('right',1);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')held=-1;if(e.key==='ArrowRight')held=1;if(e.key===' '&&mode==='play'){$('pause').click();e.preventDefault()}});addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))held=0});function addItem(){let r=Math.random(),danger=[.20,.21,.22,.23,.24][level()-1],type=r<danger*.52?'burnt':r<danger?'bomb':r<danger+.29?'drumstick':r<danger+.49?'fries':r<danger+.65?'drink':r<danger+.76?'star':'gold';let size=type==='meal'?65:type==='drumstick'||type==='gold'?66:type==='drink'?59:type==='fries'?57:52;size*=clamp(W/390,.75,1.12);items.push({type,x:rand(size/2,W-size/2),y:-size,sz:size,vy:speed()*rand(.90,1.15),rot:rand(-.22,.22),spin:rand(-.5,.5)})}function burst(x,y,bad){for(let i=0;i<(bad?46:13);i++){let a=rand(0,Math.PI*2),v=rand(bad?90:35,bad?390:170);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(bad?60:35),life:rand(.35,.9),max:.9,r:rand(3,bad?13:7),color:bad?['#ffdf27','#ff5a14','#ff1b1b','#48231a','#ffffff'][i%5]:['#ffe248','#fff','#ff8b10'][i%3]})}}function hit(it){if(it.type==='bomb'||it.type==='burnt'){if(inv>0)return;lives--;inv=1.5;shake=19;flash=.4;bucket.visible=false;burst(bucket.x,bucket.y,true);sound('boom');toast(lives?'💥 BOOM! -1 ❤️':'💥 GAME OVER!');updateHud();let s=session;if(!lives){setTimeout(()=>{if(mode==='play'&&session===s)end()},900)}else setTimeout(()=>{if(mode==='play'&&session===s)bucket.visible=true},650);return}let pts={drumstick:10,fries:5,drink:15,star:25,gold:50,meal:30}[it.type]||10,old=level();score+=pts;burst(it.x,it.y,false);texts.push({x:it.x,y:it.y,life:.75,text:'+'+pts});sound('catch');if(level()>old){toast('🔥 SPEED UP! '+speed());sound('up')}updateHud()}function drawImage(n,x,y,w,h,angle=0){let im=images[n];if(!im||!im.complete||!im.naturalWidth)return;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}function bg(){let im=images.scene;if(im.complete&&im.naturalWidth){ctx.drawImage(im,0,0,W,H)}else{let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#159df3');g.addColorStop(.65,'#8bd8ff');g.addColorStop(1,'#bb3928');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}ctx.fillStyle='#8d0b23aa';ctx.fillRect(0,H-85
